<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link

  <!-- Firebase SDK -->
  <script type="module">

    const firebaseConfig = {

      authDomain: "poetic-paths.firebaseapp.com",
      projectId: "poetic-paths",
      storageBucket: "poetic-paths.firebasestorage.app",
      messagingSenderId: "1076454624187",
      appId: "1:1076454624187:web:23a25be90ddea2a4c5929e",
      measurementId: "G-FVTC7CDRLT"

  <style>
    :root {
      /* Palette Logic: Night Blueprint (Exact Values) */
      --bg: #0E1A24;
      /* Deep Ink */
      --paper: #E6DDCF;
      /* Warm Bone */
      --panel-bg: rgba(28, 43, 56, 0.55);
      /* Schematic Blue Glass - Lighter */
      --ink: #E6DDCF;
      /* Main Text */
      --ink-dim: #B8B0A2;
      /* Secondary Text */
      --accent-path: #F2C98A;
      /* Golden Ink (Active Path) */
      --map-ui: rgba(242, 201, 138, 0.15);
      /* Golden tinted Map UI */
      --amber: #D89A5A;
      /* Terra Cotta Accent */
      --glow: rgba(242, 201, 138, 0.35);
      --map-gray: #415A6B;
      /* Inactive Roads */

      --font-serif: "Cormorant Garamond", serif;
      --font-mono: "IBM Plex Mono", monospace;
      --font-main: var(--font-serif);

      /* Legacy support */
      --accent: var(--accent-path);
      --amber-accent: var(--amber);
      --fg: var(--ink);
      --fg-dim: var(--ink-dim);
      --border: rgba(65, 90, 107, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      background: var(--bg);
      filter: grayscale(0.3) contrast(1.2) brightness(1.1) hue-rotate(185deg) saturate(1.3);
    }

    h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent-path);
      border-bottom: 1px dotted rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    .subtle {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 14px;
      color: var(--fg-dim);
      margin: 0;
      letter-spacing: 0.02em;
    }

    .branding-sub {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 16px;
    }

    .discovery-btn {
      background: none;
      border: none;
      padding: 0;
      color: var(--fg-dim);
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: all 0.4s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .discovery-btn:hover {
      color: var(--accent);
      transform: translateX(4px);
    }

    .discovery-btn b {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      opacity: 0.5;
    }

    .branding-top-left {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 2000;
    }

    .distance-circle {
      position: absolute;
      bottom: 32px;
      right: 32px;
      width: 44px;
      height: 44px;
      border: 1px solid var(--map-ui);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      text-transform: uppercase;
      pointer-events: none;
      background: none;
    }

    .distance-circle .val {
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-serif);
      color: var(--accent-path);
      line-height: 1;
    }

    .distance-circle .u {
      font-size: 7px;
      font-family: var(--font-mono);
      letter-spacing: 0.2em;
      color: var(--map-ui);
      margin-top: 2px;
    }

    .overlay-container {
      position: absolute;
      top: 32px;
      right: 32px;
      z-index: 1000;
      width: 320px;
      max-height: calc(100vh - 64px);
      overflow-y: auto;
      scrollbar-width: none;
      transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .overlay-container::-webkit-scrollbar {
      display: none;
    }

    .overlay-container.hidden {
      transform: translateX(400px);
      opacity: 0;
      pointer-events: none;
    }

    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding: 40px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .section-label {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 14px;
      color: var(--ink-dim);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      border: none;
      background: transparent;
      color: var(--ink);
      outline: none;
      font-family: var(--font-serif);
      font-size: 19px;
      line-height: 1.5;
      transition: all 0.5s;
      resize: none;
      scrollbar-width: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 16px;
    }

    textarea::-webkit-scrollbar {
      width: 0px;
    }

    textarea:hover::-webkit-scrollbar {
      width: 2px;
    }

    textarea::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .segmented-control {
      display: flex;
      gap: 20px;
    }

    .segment {
      font-family: var(--font-serif);
      font-size: 13px;
      font-style: italic;
      cursor: pointer;
      transition: all 0.4s ease;
      color: var(--fg-dim);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .segment::before {
      content: "";
      width: 5px;
      height: 5px;
      border: 1px solid currentColor;
      border-radius: 50%;
      display: inline-block;
      transition: all 0.4s ease;
    }

    .segment {
      color: var(--fg-dim);
    }

    .segment:hover {
      color: var(--amber);
    }

    .segment.active {
      color: var(--ink);
    }

    .segment.active::before {
      background: var(--accent-path);
      border-color: var(--accent-path);
      box-shadow: 0 0 10px var(--glow);
    }

    /* Timer Styles */
    .timer-container {
      position: absolute;
      bottom: 32px;
      right: 96px;
      /* Offset from distance circle */
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .timer-container.active {
      opacity: 1;
    }

    .timer-label {
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0.4;
      letter-spacing: 0.1em;
      margin-bottom: 2px;
    }

    #timerVal {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--amber);
      opacity: 0.9;
      letter-spacing: 0.05em;
    }

    #startPath {
      background: var(--amber);
      color: #0E1A24;
      padding: 14px 24px;
      font-weight: 700;
      letter-spacing: 0.1em;
      border-radius: 2px;
      text-transform: uppercase;
      font-size: 12px;
    }

    #startPath:hover {
      background: var(--paper);
      color: var(--bg);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(14, 26, 36, 0.4);
    }

    .poem-line {
      font-family: var(--font-serif);
      font-size: 24px;
      padding: 12px 0;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.1;
      cursor: default;
    }

    .poem-line.active {
      opacity: 1;
      color: var(--accent-path);
      transform: scale(1.05);
      text-shadow: 0 0 15px var(--glow);
    }

    .poem-line.walk-highlight {
      opacity: 1 !important;
      color: var(--amber) !important;
      text-shadow: 0 0 12px var(--glow);
    }

    .walk-marker-glow {
      filter: blur(4px);
      background: var(--accent-path);
      box-shadow: 0 0 15px var(--glow);
    }

    .action-row {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 10px;
    }

    button {
      background: transparent;
      border: none;
      color: var(--ink);
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0;
      transition: all 0.3s;
      opacity: 0.8;
    }

    .action-row button:hover {
      opacity: 1;
      transform: translateX(4px);
    }

    .action-row button::before {
      content: "";
      width: 24px;
      height: 24px;
      border: 1px solid var(--ink-dim);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    #generate::before {
      content: "+";
    }

    #useLocation::before {
      content: "⦿";
      font-size: 10px;
    }

    button.secondary {
      font-size: 14px;
      font-style: italic;
      color: var(--fg-dim);
    }

    button.secondary:hover {
      color: var(--amber);
    }

    .stats-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 4px;
    }

    #distanceKm {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(230, 230, 230, 0.2);
      letter-spacing: 0.1em;
    }

    .toggle-ui {
      position: absolute;
      top: 32px;
      right: 32px;
      z-index: 1001;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--map-ui);
      border-radius: 50%;
      color: var(--accent-path);
      cursor: pointer;
      padding: 0;
      margin: 0;
      outline: none;
      transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .toggle-ui:hover {
      border-color: var(--accent-soft);
      color: var(--accent);
    }

    .toggle-ui::before,
    .toggle-ui::after {
      display: none !important;
      content: none !important;
    }

    .toggle-ui.ui-visible {
      transform: translateX(-352px);
    }

    /* Total offset = panel width (320) + gap (32) = 352 */

    .poem-overlay,
    .archive-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 600px;
      height: 100vh;
      max-height: 100vh;
      padding: 120px 64px;
      display: none;
      z-index: 3000;
      pointer-events: auto;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;

      /* Translucent Feathered Paper Gradient */
      background: linear-gradient(to right,
          rgba(28, 43, 56, 0.75) 0%,
          rgba(28, 43, 56, 0.55) 40%,
          rgba(28, 43, 56, 0.15) 85%,
          transparent 100%);
      backdrop-filter: blur(8px);
    }

    .archive-overlay {
      width: 620px;
      padding-top: 140px;
    }

    .archive-title {
      font-family: var(--font-serif);
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 48px;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .archive-title span {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.05em;
      color: var(--fg-dim);
      text-transform: none;
      opacity: 1;
      border: none;
      padding: 0;
      margin: 0;
    }

    .archive-title::after {
      content: "";
      width: 40px;
      height: 1px;
      background: var(--border);
      margin-top: 16px;
    }

    .archive-item {
      position: relative;
      margin-bottom: 56px;
      cursor: pointer;
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: 24px;
      align-items: flex-start;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 16px;
      border-left: 1px solid var(--border);
    }

    .archive-item:hover {
      background: rgba(0, 0, 0, 0.03);
      border-left-color: var(--amber);
    }

    .archive-item .path-thumb {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.3;
      transition: all 0.6s ease;
      filter: grayscale(1);
    }

    .archive-item:hover .path-thumb {
      opacity: 0.8;
      filter: grayscale(0);
      transform: scale(1.1);
    }

    .archive-item .path-thumb svg {
      width: 100%;
      height: 100%;
      stroke: var(--accent);
      stroke-width: 1.2;
      fill: none;
      filter: drop-shadow(0 0 2px var(--soft-glow));
    }

    .archive-item .date {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--fg-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .archive-item .title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 22px;
      color: var(--ink);
      line-height: 1.2;
      margin: 0;
      opacity: 0.85;
      transition: opacity 0.4s ease;
    }

    .archive-item:hover .title {
      opacity: 1;
    }

    .archive-item .preview {
      font-family: var(--font-serif);
      font-size: 14px;
      color: var(--ink-dim);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 8px;
    }

    .archive-item .meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink-dim);
      opacity: 0.6;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 12px;
    }

    .delete-btn {
      color: var(--fg-dim);
      cursor: pointer;
      font-size: 10px;
      padding: 8px;
      transition: all 0.3s ease;
      background: none;
      border: none;
      position: absolute;
      top: 8px;
      right: 8px;
      opacity: 0;
      z-index: 10;
    }

    .archive-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      color: var(--amber);
      transform: scale(1.1);
    }

    .poem-overlay::-webkit-scrollbar,
    .archive-overlay::-webkit-scrollbar {
      display: none;
    }

    .close-overlay {
      position: absolute;
      top: 48px;
      right: 48px;
      left: auto;
      background: none;
      border: none;
      padding: 8px;
      color: var(--ink-dim);
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.4s ease;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .close-overlay::before {
      content: "";
      width: 1px;
      height: 20px;
      background: var(--border);
      transition: all 0.4s ease;
    }

    .close-overlay:hover {
      color: var(--amber);
      transform: translateX(-4px);
    }

    .close-overlay:hover::before {
      background: var(--amber);
      height: 30px;
    }

    .close-overlay:hover {
      border-color: var(--amber);
      color: var(--amber);
      transform: translateY(-2px);
      background: rgba(0, 0, 0, 0.03);
    }

    .poem-overlay:hover::-webkit-scrollbar {
      display: block;
      width: 2px;
    }

    .poem-overlay:hover::-webkit-scrollbar-thumb {
      background: var(--accent-soft);
    }

    .poem-line {
      font-family: var(--font-serif);
      font-size: 24px;
      font-style: italic;
      font-weight: 400;
      line-height: 1.4;
      margin: 32px 0;
      color: var(--ink);
      transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
      opacity: 0.15;
      transform: scale(0.92);
      transform-origin: left;
    }

    .poem-line.active {
      font-weight: 500;
      opacity: 1;
      transform: scale(1.05);
      text-shadow: 0 0 15px var(--glow);
      color: var(--ink);
    }

    @media (max-width: 768px) {
      .branding-top-left {
        top: 24px;
        left: 24px;
      }

      h1 {
        font-size: 24px;
      }

      .overlay-container {
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        padding: 32px 32px 48px 32px;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(20px);
        border-top: 1px solid var(--border);
        transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        box-sizing: border-box;
      }

      .overlay-container.hidden {
        transform: translateY(100%);
      }

      .glass-panel {
        width: 100%;
        gap: 24px;
      }

      button {
        width: 100%;
        justify-content: flex-start;
      }

      .toggle-ui {
        top: auto;
        bottom: 24px;
        right: 24px;
        background: rgba(0, 0, 0, 0.9);
      }

      .toggle-ui.ui-visible {
        bottom: auto;
        top: 32px;
        transform: none;
      }

      .poem-overlay,
      .archive-overlay {
        width: 100%;
        padding: 100px 32px;
        background: rgba(28, 43, 56, 0.6) !important;
      }

      .close-overlay {
        top: 32px;
        left: 32px;
      }

      .poem-line {
        font-size: 18px;
        margin: 24px 0;
      }

      .distance-circle {
        bottom: auto;
        top: 24px;
        right: 24px;
      }

      .leaflet-top.leaflet-right {
        right: 12px !important;
      }
    }

    #status {
      position: fixed;
      bottom: 32px;
      left: 32px;
      background: var(--accent);
      color: var(--bg);
      padding: 8px 12px;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      z-index: 2000;
      display: none;
    }

    .leaflet-container {
      background: var(--bg) !important;
    }

    .leaflet-control-zoom {
      border: none !important;
      margin: 0 !important;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out {
      width: 44px !important;
      height: 44px !important;
      line-height: 42px !important;
      /* Visual center adjustment */
      border-radius: 50% !important;
      background: none !important;
      border: 1px solid var(--map-ui) !important;
      color: var(--accent-path) !important;
      opacity: 0.6;
      font-size: 18px !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .leaflet-control-zoom-in:hover,
    .leaflet-control-zoom-out:hover {
      border-color: var(--accent-soft) !important;
      color: var(--accent) !important;
    }

    /* Target centering specifically for the zoom group on the right */
    .leaflet-top.leaflet-right {
      top: 50% !important;
      right: 32px !important;
      transform: translateY(-50%);
    }

    /* Keep the attribution (bottom-left) minimal and in place */
    .leaflet-bottom.leaflet-left {
      left: 32px !important;
      bottom: 12px !important;
    }

    .leaflet-control-attribution {
      background: none !important;
      color: var(--fg-dim) !important;
      font-size: 8px !important;
      opacity: 0.3;
      border: none !important;
    }

    .leaflet-control-attribution a {
      color: var(--fg-dim) !important;
      text-decoration: none !important;
    }

    /* Cinematic Route Glow */
    .route-glow-cinematic {
      filter: url(#cinematicGlow);
      opacity: 0.8;
      transition: opacity 1.5s ease;
    }

    /* Grain Overlay */
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.04;
      background: #000;
    }

    .noise {
      width: 100%;
      height: 100%;
      filter: url(#noiseFilter);
    }
  </style>
</head>

<body>
  <div style="display:none">
    <svg>
      <defs>
        <filter id="noiseFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch" />

        <filter id="cinematicGlow" x="-300%" y="-300%" width="700%" height="700%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="wide" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="mid" />
          <feMerge>
            <feMergeNode in="wide" />
            <feMergeNode in="mid" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

  </div>
  <div class="grain-overlay">

  <div id="map"></div>

  <button class="toggle-ui ui-visible" id="toggleUI" title="Toggle Sidebar">
    <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
      <circle cx="8" cy="8" r="1.0" />
      <circle cx="12" cy="8" r="1.0" />
      <circle cx="16" cy="8" r="1.0" />
      <circle cx="8" cy="12" r="1.0" />
      <circle cx="12" cy="12" r="1.0" />
      <circle cx="16" cy="12" r="1.0" />
      <circle cx="8" cy="16" r="1.0" />
      <circle cx="12" cy="16" r="1.0" />
      <circle cx="16" cy="16" r="1.0" />
    </svg>
  </button>

  <div class="branding-top-left">
    <h1>Not Taken,</h1>
    <div class="branding-sub">
      <div class="subtle" id="brandingPrompt">Turn a poem into a path</div>
      <button class="discovery-btn" id="discoveryPrompt" onclick="loadArchive()" style="display: none;">
        <b>or</b> discover a saved walk
      </button>

  </div>

  <div class="distance-circle">
    <div class="val" id="distanceKmVal">0.00</div>

  </div>

  <div class="timer-container" id="timerContainer">
    <div class="timer-label">Elapsed</div>
    <div id="timerVal">00:00</div>
  </div>

  <div class="overlay-container" id="panel">
    <div class="glass-panel">
      <div class="input-section">
        <div class="section-label">Click the map to begin.</div>
        <textarea id="poem" placeholder="Wander with the text."></textarea>
      </div>

      <div class="input-section">
        <div class="section-label">Route</div>
        <div class="segmented-control">
          <div class="segment active" data-style="circle">loop</div>
          <div class="segment" data-style="spiral">somewhere</div>
        </div>
      </div>

      <div class="action-row">
        <button id="generate">Generate route</button>
        <button id="startPath" style="display: none;">Start Walk</button>
        <button id="useLocation">Start from here</button>
        <button id="savePath" style="display: none;">Save Path</button>
      </div>
      <div class="action-row"
        style="margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px;">
        <button id="viewArchive" class="secondary">Discover Walks</button>
      </div>

      <!-- Hidden logic refs -->
      <div style="display:none">
        <select id="style">
          <option value="circle">circle</option>
          <option value="spiral">spiral</option>
        </select>
        <select id="mapping">
          <option value="word_meter">meter</option>
        </select>
        <select id="mood">
          <option value="soft">soft</option>
        </select>
        <input id="adjust" type="range" value="100" />
        <div id="wordCount">0</div>
        <div id="distanceKm">0.00 km</div>
      </div>
    </div>
  </div>

  <div class="poem-overlay" id="finalPoem">
    <button class="close-overlay" onclick="closeOverlays()">← Back</button>
    <div id="lineContainer"></div>
  </div>

  <div class="archive-overlay" id="archivePanel">
    <button class="close-overlay" onclick="closeOverlays()">✕ Close</button>
    <div class="archive-title">Discovery <span>Library of Walks</span></div>
    <div id="archiveContainer"></div>
  </div>

  <div id="status"></div>

  <script>
    const HIDDEN_ORS_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjZiYjE5OWZlNWJhNjRiMzVhMTc2YjI1MDVhNjZjZDg1IiwiaCI6Im11cm11cjY0In0=";
    let nearbyPOIs = [];

    async function fetchPOIs(lng, lat) {
      try {
        const query = `[out:json];(node["tourism"](around:5000,${lat},${lng});node["leisure"="park"](around:5000,${lat},${lng});node["natural"="beach"](around:5000,${lat},${lng}););out body;`;
        const res = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: query });
        const data = await res.json();
        nearbyPOIs = data.elements.map(e => ({ lng: e.lon, lat: e.lat, name: e.tags.name || "POI" }));
      } catch (e) { console.error("POI fetch failed", e); }
    }

    function getDist(p1, p2) {
      const R = 6371e3;
      const f1 = p1[1] * Math.PI / 180;
      const f2 = p2[1] * Math.PI / 180;
      const df = (p2[1] - p1[1]) * Math.PI / 180;
      const dl = (p2[0] - p1[0]) * Math.PI / 180;
      const a = Math.sin(df / 2) * Math.sin(df / 2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl / 2) * Math.sin(dl / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function countWords(text) {
      const cleaned = text.replace(/—/g, " ").replace(/[^\S\r\n]+/g, " ").trim();
      return cleaned ? cleaned.split(/\s+/).filter(Boolean).length : 0;
    }
    function metersFromWords(words, rule) {
      return words * (rule === "word_step" ? 0.75 : rule === "word_meter" ? 1.0 : 0.5);
    }
    function km(nMeters) { return (nMeters / 1000).toFixed(2); }

    function setStatus(msg) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.style.display = "block";
      if (!msg.toLowerCase().includes("generating")) {
        setTimeout(() => { el.style.display = "none"; }, 3000);
      }
    }



    function generateAnchors(start, targetMeters, style, mood) {
      // Loop mode needs a larger minimum size to successfully navigate city blocks without overlaps
      const effectiveMeters = style === "circle" ? Math.max(targetMeters, 600) : Math.max(targetMeters, 250);
      const mPerDegLat = 111320;
      const mPerDegLon = 111320 * Math.cos(start[1] * Math.PI / 180);

      const pts = [start];
      if (style === "circle") {
        // "Box Loop" strategy: Creates a rectangular path (4 segments)
        // This is the most effective way to force a non-overlapping loop in city grids.
        const side = effectiveMeters / 4;

        // Randomize the quadrant (which direction the 'box' grows)
        const qX = Math.random() > 0.5 ? 1 : -1;
        const qY = Math.random() > 0.5 ? 1 : -1;

        // Corner 1
        pts.push([
          start[0] + (side * qX) / mPerDegLon,
          start[1]
        ]);
        // Corner 2 (Far corner)
        pts.push([
          start[0] + (side * qX) / mPerDegLon,
          start[1] + (side * qY) / mPerDegLat
        ]);
        // Corner 3
        pts.push([
          start[0],
          start[1] + (side * qY) / mPerDegLat
        ]);
      } else {
        // 'Somewhere' mode: Try to find a POI near the target distance
        const candidates = nearbyPOIs.filter(p => {
          const d = getDist(start, [p.lng, p.lat]);
          return d >= effectiveMeters * 0.7 && d <= effectiveMeters * 1.5;
        });

        if (candidates.length > 0) {
          const poi = candidates[Math.floor(Math.random() * candidates.length)];
          pts.push([poi.lng, poi.lat]);
        } else {
          // Fallback to random destination at distance
          const ang = Math.random() * Math.PI * 2;
          pts.push([
            start[0] + (effectiveMeters * Math.cos(ang)) / mPerDegLon,
            start[1] + (effectiveMeters * Math.sin(ang)) / mPerDegLat
          ]);
        }
      }
      pts.push(start);
      return pts;
    }

    async function orsDirections(coordinatesLngLat) {
      // On GitHub Pages, we always use the direct API call
      const url = "https://api.openrouteservice.org/v2/directions/foot-walking/geojson";
      const headers = {
        "Content-Type": "application/json",
        "Authorization": HIDDEN_ORS_KEY
      };

      const res = await fetch(url, {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ coordinates: coordinatesLngLat, instructions: false })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || "Generation failed");
      }
      return await res.json();
    }



    const map = L.map("map", { zoomControl: true, attributionControl: false }).setView([32.066, 34.777], 15);
    map.zoomControl.setPosition('topright');
    L.control.attribution({ position: 'bottomleft' }).addTo(map);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png", { attribution: "&copy; OSM &copy; CARTO" }).addTo(map);

    let startMarker = null;
    let routeLayer = null;
    let previewLayer = null;
    let currentStart = null;
    let lastGeojson = null;

    // Walk State
    let isWalking = false;
    let walkStartTime = 0;
    let walkMarker = null;
    let walkAnimFrame = null;
    let totalWalkDuration = 0; // ms
    let pathLatLngs = [];
    let cumulativeDistances = [];
    let totalPathDistance = 0;
    let lastActiveIdx = -1;

    function updateDiscoveryPrompt() {
      const prompt = document.getElementById("discoveryPrompt");
      if (prompt) prompt.style.display = "flex";
    }
    updateDiscoveryPrompt();

    function setStartPoint(lng, lat) {
      currentStart = [lng, lat];
      if (startMarker) startMarker.remove();
      startMarker = L.circleMarker([lat, lng], { radius: 8, color: "var(--accent)", weight: 2, fillColor: "var(--bg)", fillOpacity: 1 }).addTo(map);
      setStatus("Start point set ✓");
      fetchPOIs(lng, lat);
    }

    map.on("click", (e) => setStartPoint(e.latlng.lng, e.latlng.lat));

    const poemEl = document.getElementById("poem");
    const wordCountEl = document.getElementById("wordCount");
    const distanceKmEl = document.getElementById("distanceKm");
    const styleEl = document.getElementById("style");
    const moodEl = document.getElementById("mood");
    const mappingEl = document.getElementById("mapping");
    const adjustEl = document.getElementById("adjust");
    const panel = document.getElementById("panel");
    const toggleBtn = document.getElementById("toggleUI");

    function refreshStats() {
      const words = countWords(poemEl.value);
      if (wordCountEl) wordCountEl.textContent = words;
      const meters = metersFromWords(words, mappingEl.value) * (parseInt(adjustEl.value) / 100);
      const val = km(meters);
      if (document.getElementById("distanceKmVal")) document.getElementById("distanceKmVal").textContent = val;
      if (distanceKmEl) distanceKmEl.textContent = `${val} km`;
    }

    poemEl.addEventListener("input", refreshStats);

    // Segmented control logic to sync with hidden style
    document.querySelectorAll(".segment").forEach(seg => {
      seg.addEventListener("click", () => {
        document.querySelectorAll(".segment").forEach(s => s.classList.remove("active"));
        seg.classList.add("active");
        styleEl.value = seg.dataset.style;
        refreshStats();
      });
    });

    toggleBtn.addEventListener("click", () => {
      panel.classList.toggle("hidden");
      toggleBtn.classList.toggle("ui-visible");
    });

    document.getElementById("useLocation").addEventListener("click", () => {
      setStatus("Requesting location...");
      navigator.geolocation.getCurrentPosition(
        (pos) => { setStartPoint(pos.coords.longitude, pos.coords.latitude); map.setView([pos.coords.latitude, pos.coords.longitude], 15); },
        () => setStatus("Location failed. Click manually."),
        { enableHighAccuracy: false, timeout: 5000 }
      );
    });

    function updateRouteLighting() {
      if (!routeLayer) return;
      const zoom = map.getZoom();

      // Amplified scaling: whiter core, broader and more intense glow
      const scale = Math.pow(1.3, zoom - 15);
      const glowWeight = 16 * scale;
      const glowOpacity = Math.min(0.95, 0.5 + (zoom - 10) * 0.05);
      const coreOpacity = Math.min(0.85, 0.4 + (zoom - 10) * 0.04);

      routeLayer.eachLayer(layer => {
        if (layer.options.className === 'route-glow-cinematic') {
          layer.setStyle({ weight: glowWeight, opacity: glowOpacity });
        } else if (layer.options.className === 'route-core-nav') {
          layer.setStyle({ opacity: coreOpacity });
        }
      });
    }

    function updateLineFocus() {
      const container = document.getElementById("finalPoem");
      const lines = container.getElementsByClassName("poem-line");
      const center = container.scrollTop + container.offsetHeight / 2;

      Array.from(lines).forEach(line => {
        const lineCenter = line.offsetTop + line.offsetHeight / 2;
        const distToCenter = Math.abs(center - lineCenter);
        const maxDist = container.offsetHeight / 2;

        // Immersive "Focus Band" logic
        // Center = 1.0, Edges fade to ~0.05-0.1
        let opacity = 1 - (distToCenter / maxDist);
        opacity = Math.max(0.08, Math.pow(opacity, 3.5)); // Sharper falloff for 60% -> 25% -> 10%

        line.style.opacity = opacity;

        // Guide behavior
        if (distToCenter < 35) {
          line.classList.add("active");
        } else {
          line.classList.remove("active");
        }
      });
    }

    document.getElementById("finalPoem").addEventListener("scroll", updateLineFocus);
    map.on("zoomend", updateRouteLighting);

    async function generate() {
      if (!currentStart) { setStatus("Set start point first"); return; }
      const words = countWords(poemEl.value);
      if (words < 5) { setStatus("Write more text..."); return; }

      setStatus("Searching routes...");
      try {
        const meters = metersFromWords(words, mappingEl.value) * (parseInt(adjustEl.value) / 100);
        const anchors = generateAnchors(currentStart, meters, styleEl.value, moodEl.value);
        const data = await orsDirections(anchors.map(p => [p[0], p[1]]));

        if (routeLayer) routeLayer.remove();
        lastGeojson = data;
        renderFinalPath(lastGeojson);
      } catch (err) {
        setStatus("Could not find path");
        console.error(err);
      }
    }
    window.generate = generate;

    function prepareWalkData() {
      if (!lastGeojson) return;
      const coords = lastGeojson.features[0].geometry.coordinates;
      pathLatLngs = coords.map(c => [c[1], c[0]]);

      cumulativeDistances = [0];
      let d = 0;
      for (let i = 1; i < pathLatLngs.length; i++) {
        d += getDist([pathLatLngs[i - 1][1], pathLatLngs[i - 1][0]], [pathLatLngs[i][1], pathLatLngs[i][0]]);
        cumulativeDistances.push(d);
      }
      totalPathDistance = d;
      const lines = document.getElementsByClassName("poem-line");
      totalWalkDuration = lines.length * 3500; // 3.5s per line
    }

    function startWalk() {
      if (isWalking) { stopWalk(); return; }
      if (!lastGeojson) return;

      isWalking = true;
      walkStartTime = performance.now();
      document.getElementById("startPath").textContent = "Stop Walk";
      document.getElementById("timerContainer").classList.add("active");

      // Ensure poem overlay is visible when walking
      document.getElementById("finalPoem").style.display = "block";
      panel.classList.add("hidden");
      toggleBtn.classList.remove("ui-visible");

      // Marker
      if (walkMarker) walkMarker.remove();
      walkMarker = L.circleMarker(pathLatLngs[0], {
        radius: 6,
        color: "var(--amber-accent)",
        weight: 1,
        fillColor: "var(--accent)",
        fillOpacity: 1,
        className: 'walk-marker-glow'
      }).addTo(map);

      // Animation Loop
      function frame(now) {
        if (!isWalking) return;
        const elapsed = now - walkStartTime;
        let progress = elapsed / totalWalkDuration;

        if (progress >= 1) {
          progress = 1;
          stopWalk();
        }

        updateWalkState(progress, elapsed);
        walkAnimFrame = requestAnimationFrame(frame);
      }
      walkAnimFrame = requestAnimationFrame(frame);
      setStatus("Journey started");
    }

    function stopWalk() {
      isWalking = false;
      if (walkAnimFrame) cancelAnimationFrame(walkAnimFrame);
      document.getElementById("startPath").textContent = "Start Walk";
      document.getElementById("timerContainer").classList.remove("active");
      if (walkMarker) {
        walkMarker.remove();
        walkMarker = null;
      }
      // Reset highlighting
      const lines = document.getElementsByClassName("poem-line");
      for (let l of lines) l.classList.remove("walk-highlight");
    }

    function updateWalkState(progress, elapsed) {
      // 1. Timer
      const totalSecs = Math.floor(elapsed / 1000);
      const mins = Math.floor(totalSecs / 60).toString().padStart(2, '0');
      const secs = (totalSecs % 60).toString().padStart(2, '0');
      document.getElementById("timerVal").textContent = `${mins}:${secs}`;

      // 2. Marker Position
      const targetDist = progress * totalPathDistance;
      let idx = 0;
      while (idx < cumulativeDistances.length - 1 && cumulativeDistances[idx + 1] < targetDist) {
        idx++;
      }
      const segmentStartDist = cumulativeDistances[idx];
      const segmentEndDist = cumulativeDistances[idx + 1];
      const segmentProgress = (targetDist - segmentStartDist) / (segmentEndDist - segmentStartDist);

      const p1 = pathLatLngs[idx];
      const p2 = pathLatLngs[idx + 1];
      if (p1 && p2) {
        const lat = p1[0] + (p2[0] - p1[0]) * segmentProgress;
        const lng = p1[1] + (p2[1] - p1[1]) * segmentProgress;
        walkMarker.setLatLng([lat, lng]);
        // Keep in view if walking
        if (!map.getBounds().contains([lat, lng])) {
          map.panTo([lat, lng]);
        }
      }

      // 3. Poem Highlighting
      const lines = document.getElementsByClassName("poem-line");
      const activeIdx = Math.min(lines.length - 1, Math.floor(progress * lines.length));

      for (let i = 0; i < lines.length; i++) {
        if (i === activeIdx) {
          lines[i].classList.add("walk-highlight");
          // Center the active line
          if (i !== lastActiveIdx) {
            lines[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
            lastActiveIdx = i;
          }
        } else {
          lines[i].classList.remove("walk-highlight");
        }
      }
    }

    async function savePath() {
      if (!lastGeojson) return;
      const poem = poemEl.value;
      const distance = document.getElementById("distanceKmVal").textContent;
      const style = styleEl.value;

      setStatus("Saving to cloud...");
      try {
        // Important: Stringify GeoJSON to avoid Firestore nested array errors
        await window.fbAdd(window.fbColl(window.db, "walks"), {
          poem,
          geojson: JSON.stringify(lastGeojson),
          distance,
          style,
          timestamp: Date.now()
        });
        setStatus("Saved to archive ✓");
        document.getElementById("savePath").style.display = "none";
      } catch (e) {
        console.error("Firestore Save Error:", e);
        setStatus("Save failed");
      }
    }

    function thumbnailSVG(coords) {
      if (!coords || coords.length === 0) return "";
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      coords.forEach(c => {
        if (c[0] < minX) minX = c[0]; if (c[0] > maxX) maxX = c[0];
        if (c[1] < minY) minY = c[1]; if (c[1] > maxY) maxY = c[1];
      });
      const rangeX = maxX - minX || 0.0001;
      const rangeY = maxY - minY || 0.0001;
      const padding = 5;
      const size = 100 - (padding * 2);
      const points = coords.map(c => {
        const x = padding + ((c[0] - minX) / rangeX) * size;
        const y = padding + (1 - (c[1] - minY) / rangeY) * size;
        return `${x},${y}`;
      }).join(" ");
      return `<svg viewBox="0 0 100 100"><polyline points="${points}" /></svg>`;
    }

    function renderFinalPath(data) {
      if (!data || !data.features || data.features.length === 0) {
        console.warn("Invalid or empty GeoJSON provided to renderer");
        return;
      }

      if (routeLayer) routeLayer.remove();
      routeLayer = L.featureGroup().addTo(map);

      // Layer 1: Cinematic Path Glow
      L.geoJSON(data, {
        style: { color: "#F2C98A", weight: 12, opacity: 0.4, className: 'route-glow-cinematic', lineCap: "round", lineJoin: "round" }
      }).addTo(routeLayer);

      // Layer 2: Core Ink Path
      L.geoJSON(data, {
        style: { color: "#F2C98A", weight: 2.2, opacity: 0.9, className: 'route-core-nav', lineCap: "round", lineJoin: "round" }
      }).addTo(routeLayer);

      const bounds = routeLayer.getBounds();
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [100, 100], animate: true, duration: 2 });
      }

      const lines = poemEl.value.split(/\n+/).filter(l => l.trim());
      document.getElementById("lineContainer").innerHTML = lines.map((l, i) => `<div class="poem-line" data-index="${i}">${l}</div>`).join("");
      document.getElementById("finalPoem").style.display = "block";
      document.getElementById("startPath").style.display = "flex";
      document.getElementById("savePath").style.display = "flex";

      setStatus("Route illuminated");
      updateDiscoveryPrompt();
      stopWalk();
      prepareWalkData();
    }

    async function loadArchive() {
      try {
        setStatus("Loading walks...");
        const q = window.fbQuery(window.fbColl(window.db, "walks"), window.fbOrderBy("timestamp", "desc"), window.fbLimit(30));
        const querySnapshot = await window.fbGetDocs(q);
        const data = [];
        querySnapshot.forEach((doc) => {
          const entry = doc.data();
          if (typeof entry.geojson === 'string') {
            try { entry.geojson = JSON.parse(entry.geojson); } catch (e) { }
          }
          data.push({ id: doc.id, ...entry });
        });
        const container = document.getElementById("archiveContainer");
        if (data.length === 0) {
          container.innerHTML = `<div class="subtle" style="padding: 20px;">No walks found.</div>`;
        } else {
          container.innerHTML = data.map(entry => {
            const lines = (entry.poem || "").split('\n').filter(l => l.trim());
            const title = lines[0] || "Untitled Path";
            const body = lines.slice(1).join(' ') || entry.poem;

            let dateLabel = "";
            if (entry.timestamp) {
              const d = entry.timestamp.toDate ? entry.timestamp.toDate() : new Date(entry.timestamp);
              const month = d.toLocaleDateString('en-GB', { month: 'short' }).toUpperCase();
              const day = d.getDate();
              const year = d.getFullYear();
              const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
              dateLabel = `${day} ${month} ${year} AT ${time}`;
            }

            const thumb = thumbnailSVG(entry.geojson?.features?.[0]?.geometry?.coordinates);

            return `
              <div class="archive-item" onclick="loadArchivedEntry('${entry.id}')">
                <div class="path-thumb">${thumb}</div>
                <div class="content">
                  <div class="date">${dateLabel}</div>
                  <div class="title">${title}</div>
                  <div class="preview">${body}</div>
                  <div class="meta">
                    <i>${entry.style === 'circle' ? 'loop' : 'destination'}</i>
                    <i>${entry.distance || "0.00"} KM</i>
                  </div>
                  <button class="delete-btn" onclick="event.stopPropagation(); deleteArchivedEntry('${entry.id}')" title="Delete path">✕</button>
                </div>
              </div>
            `;
          }).join("");
        }
        document.getElementById("archivePanel").style.display = "block";
        document.getElementById("finalPoem").style.display = "none";
        panel.classList.add("hidden");
        toggleBtn.classList.remove("ui-visible");
        setStatus("");
      } catch (e) {
        console.error(e);
        setStatus("Could not load archive");
      }
    }

    // Cache for loaded walks to avoid re-fetching on hover/click
    let archiveCache = {};

    window.loadArchivedEntry = async function (id) {
      clearPreview();
      try {
        const docRef = window.fbDoc(window.db, "walks", id);
        const docSnap = await window.fbGetDoc(docRef);
        let entry = null;
        if (docSnap.exists()) {
          entry = docSnap.data();
          if (typeof entry.geojson === 'string') {
            try { entry.geojson = JSON.parse(entry.geojson); } catch (e) { }
          }
        }

        if (entry) {
          poemEl.value = entry.poem;
          lastGeojson = entry.geojson;

          // Hide archive reveal main UI
          document.getElementById("archivePanel").style.display = "none";
          panel.classList.remove("hidden");
          toggleBtn.classList.add("ui-visible");

          // Stabilization Timeout: Give Leaflet/DOM a moment to reflow
          setTimeout(() => {
            map.invalidateSize();
            if (lastGeojson) {
              renderFinalPath(lastGeojson);
              document.getElementById("distanceKmVal").textContent = entry.distance || "0.00";
              prepareWalkData(); // Ensure walk hydration is fresh
              setStatus("Walk restored");
            } else {
              setStatus("No path data found");
            }
          }, 200);
        }
      } catch (e) {
        console.error(e);
        setStatus("Error loading entry");
      }
    };

    window.deleteArchivedEntry = async function (id) {
      if (!confirm("Delete this path?")) return;
      try {
        await window.fbDeleteDoc(window.fbDoc(window.db, "walks", id));
        setStatus("Removed from archive");
        loadArchive(); // Refresh list
      } catch (e) {
        console.error(e);
        setStatus("Delete failed");
      }
    };

    window.previewArchivedEntry = async function (id) {
      try {
        let entry = archiveCache[id];
        if (!entry) {
          // If not in cache, we could fetch it, but usually the archive list should have the data
          // For simplicity, we'll just check if it was loaded during loadArchive
          const items = document.querySelectorAll('.archive-item');
          // This is a bit hacky, better to just fetch or use a global state
          const docRef = window.fbDoc(window.db, "walks", id);
          const docSnap = await window.fbGetDoc(docRef);
          if (docSnap.exists()) {
            entry = docSnap.data();
            if (typeof entry.geojson === 'string') {
              try { entry.geojson = JSON.parse(entry.geojson); } catch (e) { }
            }
            archiveCache[id] = entry;
          }
        }

        if (entry && entry.geojson) {
          if (previewLayer) previewLayer.remove();
          previewLayer = L.geoJSON(entry.geojson, {
            style: { color: "var(--accent)", weight: 2, opacity: 0.3, dashArray: "5, 10", lineCap: "round" }
          }).addTo(map);
        }
      } catch (e) { }
    };

    window.clearPreview = function () {
      if (previewLayer) {
        previewLayer.remove();
        previewLayer = null;
      }
    };

    window.closeOverlays = function () {
      document.getElementById("archivePanel").style.display = "none";
      document.getElementById("finalPoem").style.display = "none";
      panel.classList.remove("hidden");
      toggleBtn.classList.add("ui-visible");
    };

    document.getElementById("generate").addEventListener("click", generate);
    document.getElementById("savePath").addEventListener("click", savePath);
    document.getElementById("viewArchive").addEventListener("click", loadArchive);
    document.getElementById("startPath").addEventListener("click", startWalk);


  </script>
</body>

</html>
